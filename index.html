<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="메모장">
  <meta name="format-detection" content="telephone=no">
  <title>공정팀 메모장</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    :root {
      color-scheme: light;
      --blue:#075acb;
      --blue-dark:#03489f;
      --navy:#061842;
      --border:#d9e0e9;
      --muted:#67748a;
      --bg:#ffffff;
    }

    * { box-sizing:border-box; }
    html, body {
      margin:0;
      width:100%;
      min-height:100%;
      background:#fff;
      color:#101729;
      overscroll-behavior-y:none;
    }

    body.detail-open {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      overflow:hidden;
      overscroll-behavior:none;
    }
    body {
      font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-text-size-adjust:100%;
      padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    button, textarea { font:inherit; }

    .app {
      min-height:100vh;
      background:#fff;
    }

    /* ---------- 메인 ---------- */
    #homeView {
      min-height:100vh;
      padding:28px 18px 24px;
    }

    .home-title {
      text-align:center;
      margin:12px 0 24px;
      font-size:31px;
      font-weight:800;
      color:var(--navy);
      letter-spacing:.28em;
      text-indent:.28em;
    }

    .plant-list {
      display:flex;
      flex-direction:column;
      gap:9px;
      max-width:620px;
      margin:0 auto;
    }

    .plant-btn {
      width:100%;
      height:64px;
      border:0;
      border-radius:12px;
      color:#fff;
      display:grid;
      grid-template-columns:44px 1fr auto 24px;
      align-items:center;
      gap:8px;
      padding:0 15px;
      box-shadow:0 4px 10px rgba(28,60,120,.12);
      cursor:pointer;
      text-align:left;
      -webkit-tap-highlight-color:transparent;
    }

    .plant-btn:active { transform:translateY(1px); }

    .plant-no {
      width:38px;
      height:38px;
      border-radius:50%;
      background:rgba(255,255,255,.96);
      color:inherit;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      font-weight:800;
    }

    .plant-name { font-size:24px; font-weight:800; }
    .capacity { font-size:17px; font-weight:650; white-space:nowrap; }
    .chev { font-size:38px; line-height:1; font-weight:300; }

    .p1 { background:linear-gradient(135deg,#4298ec,#2a86e1); }
    .p2 { background:linear-gradient(135deg,#2cc5c4,#19aaa9); }
    .p3 { background:linear-gradient(135deg,#a4d638,#86bd22); }
    .p4 { background:linear-gradient(135deg,#ffc034,#ffad19); }
    .p5 { background:linear-gradient(135deg,#ff9a35,#fa8121); }
    .p6 { background:linear-gradient(135deg,#a282de,#8064ca); }
    .p7 { background:linear-gradient(135deg,#f27b9c,#e96187); }
    .p8 { background:linear-gradient(135deg,#658fee,#4778dd); }
    .p9 { background:linear-gradient(135deg,#36bce0,#1ba5cd); }

    /* 번호 원 안의 숫자는 각 카드 색과 맞추기 위한 별도 색 */
    .p1 .plant-no { color:#318ce6; }
    .p2 .plant-no { color:#20b7b5; }
    .p3 .plant-no { color:#8bc529; }
    .p4 .plant-no { color:#f7b01e; }
    .p5 .plant-no { color:#f68b26; }
    .p6 .plant-no { color:#866acc; }
    .p7 .plant-no { color:#e96d91; }
    .p8 .plant-no { color:#527fdf; }
    .p9 .plant-no { color:#23acd2; }

    /* ---------- 상세/수정 ---------- */
    #detailView {
      display:none;
      position:fixed;
      left:0;
      right:0;
      top:var(--vv-top, 0px);
      width:100%;
      height:var(--app-height, 100dvh);
      overflow:hidden;
      background:#fff;
      z-index:500;
    }

    .topbar {
      height:108px;
      flex:0 0 108px;
      background:linear-gradient(#0b64d6,#0759c6);
      color:#fff;
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      box-shadow:0 2px 7px rgba(0,0,0,.12);
      z-index:10;
      position:relative;
      flex:0 0 108px;
      flex-shrink:0;
    }

    .plant-head {
      min-width:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:4px;
    }

    .team-name {
      font-size:23px;
      font-weight:850;
      line-height:1.05;
      white-space:nowrap;
      letter-spacing:-0.03em;
    }

    .saved-in-header {
      font-size:12px;
      font-weight:650;
      line-height:1.15;
      color:rgba(255,255,255,.9);
      white-space:nowrap;
    }

    .top-actions {
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }

    .top-btn {
      height:40px;
      min-width:101px;
      padding:0 10px;
      border:1px solid rgba(255,255,255,.95);
      border-radius:8px;
      background:rgba(255,255,255,.03);
      color:#fff;
      font-size:16px;
      font-weight:750;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      -webkit-tap-highlight-color:transparent;
    }

    .top-btn:active { background:rgba(255,255,255,.12); }
    .top-btn[disabled] { opacity:.55; }

    .detail-body {
      height:calc(var(--app-height, 100dvh) - 108px);
      padding:6px 12px 8px;
      max-width:760px;
      width:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .detail-title {
      display:none;
    }

    #status {
      display:none;
    }

    .content-box {
      flex:1 1 auto;
      min-height:0;
      border:1px solid #cfd8e5;
      border-radius:9px;
      background:#fff;
      overflow:hidden;
      position:relative;
    }

    #notice {
      display:none;
      height:100%;
      min-height:0;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
      padding:16px 16px 22px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      font-size:18px;
      line-height:1.42;
      user-select:text;
      -webkit-user-select:text;
    }

    #editor {
      display:none;
      width:100%;
      height:100%;
      min-height:0;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
      border:0;
      outline:0;
      resize:none;
      padding:16px 16px 22px;
      background:#fff;
      color:#101729;
      font-size:18px;
      line-height:1.42;
      white-space:pre-wrap;
    }


    #error {
      display:none;
      height:100%;
      overflow-y:auto;
      padding:18px 16px;
      color:#b00020;
      font-size:16px;
    }

    /* ---------- 확인 팝업 ---------- */
    .modal-backdrop {
      display:none;
      position:fixed;
      inset:0;
      z-index:1000;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.33);
      padding:24px;
    }
    .modal-backdrop.show { display:flex; }

    .modal {
      width:min(350px,100%);
      background:#fff;
      border-radius:14px;
      padding:24px 20px 18px;
      box-shadow:0 14px 38px rgba(0,0,0,.25);
      text-align:center;
    }

    .modal-title {
      font-size:21px;
      font-weight:850;
      color:#111827;
      margin-bottom:10px;
    }

    .modal-message {
      font-size:15px;
      line-height:1.55;
      color:#4b5563;
      margin-bottom:19px;
      white-space:pre-line;
    }

    .modal-actions { display:flex; gap:10px; }

    .modal-btn {
      flex:1;
      height:44px;
      border-radius:8px;
      border:1px solid #c7d0dc;
      background:#fff;
      color:#182234;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .modal-btn.primary {
      background:#075acb;
      border-color:#075acb;
      color:#fff;
    }

    @media (max-width:430px) {
      #homeView { padding:22px 14px 20px; }
      .home-title { font-size:29px; margin-bottom:20px; }
      .plant-btn {
        height:58px;
        grid-template-columns:39px 1fr auto 19px;
        padding:0 11px;
        gap:6px;
      }
      .plant-no { width:34px; height:34px; font-size:18px; }
      .plant-name { font-size:22px; }
      .capacity { font-size:16px; }
      .topbar {
        height:68px;
        padding:0 12px;
        gap:8px;
        grid-template-columns:1fr auto auto;
      }
      .team-name { font-size:18px; }
      .top-btn { min-width:104px; height:40px; padding:0 10px; font-size:16px; }
      .detail-title { font-size:28px; }
    }

    @media (max-width:370px) {
      .plant-name { font-size:20px; }
      .capacity { font-size:14px; }
      .top-btn { min-width:94px; font-size:14px; }
      .team-name { font-size:16px; }
    }
  
    /* 상세 화면: 상단은 고정, 메모/입력 영역만 내부 스크롤 */
    #detailView {
      display:none;
      flex-direction:column;
    }

    #detailView.active {
      display:flex;
    }

    @media (max-width:430px) {
      .topbar {
        height:64px;
        flex-basis:64px;
        padding:0 10px;
        gap:7px;
      }
      .team-name { font-size:18px; }
      .top-btn {
        min-width:102px;
        height:39px;
        padding:0 9px;
        font-size:16px;
      }
      .detail-body {
        height:calc(100dvh - 64px);
        padding:6px 12px 8px;
      }
      .detail-title {
        font-size:27px;
        margin:1px 0 2px;
      }
      #status {
        min-height:21px;
        padding:0 2px 2px;
        font-size:12px;
        line-height:19px;
      }
      #notice, #editor {
        padding:14px 14px 20px;
        font-size:18px;
      }
    }

  
    /* 최종 상세화면 헤더 높이 고정 */
    @media (max-width:430px) {
      .topbar {
        height:108px !important;
        flex-basis:108px !important;
        padding:10px 10px !important;
        grid-template-columns:1fr auto !important;
        gap:10px !important;
      }

      .detail-body {
        height:calc(var(--app-height, 100dvh) - 108px) !important;
        padding:6px 10px 8px !important;
      }

      .team-name {
        font-size:22px !important;
      }

      .saved-in-header {
        font-size:12px !important;
      }

      .top-actions {
        gap:7px;
      }

      .top-btn {
        min-width:98px !important;
        height:39px !important;
        padding:0 8px !important;
        font-size:15px !important;
      }
    }

    @media (max-width:370px) {
      .topbar {
        padding-left:10px !important;
        padding-right:10px !important;
      }
      .team-name {
        font-size:20px !important;
      }
      .saved-in-header {
        font-size:11px !important;
      }
      .top-btn {
        min-width:88px !important;
        font-size:14px !important;
      }
    }

  
    .top-btn:disabled {
      opacity:.55;
      cursor:default;
      pointer-events:none;
    }

  
    /* 앱 일반 화면에서는 Chrome의 텍스트 선택/길게누르기 메뉴를 막습니다. */
    body,
    button,
    .home-title,
    .plant-list,
    .plant-btn,
    .topbar,
    .plant-head,
    .top-actions,
    .detail-body,
    .content-box,
    #notice {
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }

    /* 실제 메모 편집창은 커서 이동/복사/붙여넣기를 위해 선택 허용 */
    #editor {
      -webkit-user-select:text;
      user-select:text;
      -webkit-touch-callout:default;
    }

  </style>
</head>

<body>
<div class="app">

  <section id="homeView">
    <div class="home-title">메모장</div>

    <div class="plant-list">
      <button class="plant-btn p1" data-plant="구룡"><span class="plant-no">1</span><span class="plant-name">구룡</span><span class="capacity">(220㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p2" data-plant="임천"><span class="plant-no">2</span><span class="plant-name">임천</span><span class="capacity">(200㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p3" data-plant="장암"><span class="plant-no">3</span><span class="plant-name">장암</span><span class="capacity">(270㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p4" data-plant="은산"><span class="plant-no">4</span><span class="plant-name">은산</span><span class="capacity">(350㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p5" data-plant="남면"><span class="plant-no">5</span><span class="plant-name">남면</span><span class="capacity">(170㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p6" data-plant="서운"><span class="plant-no">6</span><span class="plant-name">서운</span><span class="capacity">(136㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p7" data-plant="반교"><span class="plant-no">7</span><span class="plant-name">반교</span><span class="capacity">(68㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p8" data-plant="외산"><span class="plant-no">8</span><span class="plant-name">외산</span><span class="capacity">(400㎥/일)</span><span class="chev">›</span></button>
      <button class="plant-btn p9" data-plant="장항"><span class="plant-no">9</span><span class="plant-name">장항</span><span class="capacity">(68㎥/일)</span><span class="chev">›</span></button>
    </div>
  </section>

  <section id="detailView">
    <div class="topbar">
      <div class="plant-head">
        <div id="headerPlantName" class="team-name">처리장</div>
        <div id="headerSavedTime" class="saved-in-header"></div>
      </div>

      <div class="top-actions">
        <button id="leftButton" class="top-btn" type="button"><span id="leftIcon">←</span><span id="leftLabel">이전화면</span></button>
        <button id="rightButton" class="top-btn" type="button"><span id="rightIcon">✎</span><span id="rightLabel">수정</span></button>
      </div>
    </div>

    <div class="detail-body">
      <div id="detailTitle" class="detail-title"></div>
      <div id="status"></div>

      <div class="content-box">
        <div id="notice"></div>
        <textarea id="editor" spellcheck="false" aria-label="처리장 메모 수정"></textarea>
        <div id="error"></div>
      </div>
</div>
  </section>

</div>

<div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <div id="modalTitle" class="modal-title"></div>
    <div id="modalMessage" class="modal-message"></div>
    <div class="modal-actions">
      <button id="modalNo" class="modal-btn" type="button">아니오</button>
      <button id="modalYes" class="modal-btn primary" type="button">예</button>
    </div>
  </div>
</div>

<script>
/*
  ★ Apps Script 배포 후 아래 PROXY_URL을 새 웹앱 URL로 교체하세요.
  예:
  const PROXY_URL = "https://script.google.com/macros/s/....../exec";
*/
const PROXY_URL = "https://script.google.com/macros/s/AKfycbwWK94zgirFMRLLUFy5PllRzGqngjmt2SJpI7_eb42G0WrJ37zol3rsUBsW7c2Vjz4/exec";

const homeView = document.getElementById('homeView');
const detailView = document.getElementById('detailView');
const detailTitle = document.getElementById('detailTitle');
const statusEl = document.getElementById('status');
const headerPlantName = document.getElementById('headerPlantName');
const headerSavedTime = document.getElementById('headerSavedTime');
const noticeEl = document.getElementById('notice');
const editorEl = document.getElementById('editor');
const errorEl = document.getElementById('error');
const leftButton = document.getElementById('leftButton');
const rightButton = document.getElementById('rightButton');
const leftIcon = document.getElementById('leftIcon');
const leftLabel = document.getElementById('leftLabel');
const rightIcon = document.getElementById('rightIcon');
const rightLabel = document.getElementById('rightLabel');

const confirmModal = document.getElementById('confirmModal');
const modalTitle = document.getElementById('modalTitle');
const modalMessage = document.getElementById('modalMessage');
const modalNo = document.getElementById('modalNo');
const modalYes = document.getElementById('modalYes');

let selectedPlant = '';
let currentText = '';
let editMode = false;
let loadingPlant = false;
let loadingTimer = null;

const DRAFT_STORAGE_KEY = 'processMemoDraftV1';
let loadingFrame = 0;
let confirmAction = null;
let suppressNextDetailPop = false;
const frames = ['불러오는 중', '불러오는 중.', '불러오는 중..', '불러오는 중...'];

function jsonp(params, timeoutMs=30000) {
  return new Promise((resolve, reject) => {
    if (!PROXY_URL || PROXY_URL.indexOf('여기에_') === 0) {
      reject(new Error('Apps Script 웹앱 주소가 아직 입력되지 않았습니다.'));
      return;
    }

    const callbackName = '__processmemo_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('응답 시간이 초과되었습니다.'));
    }, timeoutMs);

    function cleanup() {
      clearTimeout(timeout);
      try { delete window[callbackName]; } catch (_) {}
      script.remove();
    }

    window[callbackName] = payload => {
      cleanup();
      resolve(payload || {});
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('서버에 연결하지 못했습니다.'));
    };

    const query = new URLSearchParams({
      ...params,
      callback: callbackName,
      t: Date.now().toString()
    });

    script.src = PROXY_URL + '?' + query.toString();
    document.head.appendChild(script);
  });
}

function startLoading(label='불러오는 중') {
  stopLoading();
  loadingFrame = 0;

  const draw = () => {
    const dots = '.'.repeat(loadingFrame % 4);
    const message = label + dots;
    statusEl.textContent = message;
    headerSavedTime.textContent = message;
    loadingFrame++;
  };

  draw();
  loadingTimer = setInterval(draw, 320);
}

function stopLoading() {
  if (loadingTimer) clearInterval(loadingTimer);
  loadingTimer = null;
}

function showError(message) {
  stopLoading();
  statusEl.textContent = '';
  noticeEl.style.display = 'none';
  editorEl.style.display = 'none';
  errorEl.style.display = 'block';
  errorEl.textContent = message;
}


function saveDraftLocally() {
  if (!editMode || !selectedPlant) return;

  const payload = {
    plant: selectedPlant,
    originalText: currentText,
    draftText: editorEl.value,
    savedAt: Date.now()
  };

  try {
    localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(payload));
  } catch (_) {}
}

function clearLocalDraft() {
  try {
    localStorage.removeItem(DRAFT_STORAGE_KEY);
  } catch (_) {}
}

function getLocalDraft() {
  try {
    const raw = localStorage.getItem(DRAFT_STORAGE_KEY);
    if (!raw) return null;

    const data = JSON.parse(raw);
    if (!data || !data.plant || typeof data.draftText !== 'string') return null;

    return data;
  } catch (_) {
    return null;
  }
}

function restoreLocalDraft() {
  const draft = getLocalDraft();
  if (!draft) return false;

  selectedPlant = draft.plant;
  currentText = typeof draft.originalText === 'string' ? draft.originalText : '';
  editMode = true;

  try {
    // 복원된 수정화면 아래에 처리장 상세 상태를 한 단계 둡니다.
    // 수정 보호용 상태가 정리된 뒤에도 상세 읽기 화면에 그대로 머물 수 있게 합니다.
    history.pushState({ processMemoDetail: true, plant: selectedPlant }, '', location.href);
    history.pushState({ processMemoEdit: true, plant: selectedPlant }, '', location.href);
  } catch (_) {}

  homeView.style.display = 'none';
  detailView.classList.add('active');
  document.body.classList.add('detail-open');
  detailTitle.textContent = selectedPlant + ' 처리장';
  headerPlantName.textContent = selectedPlant + '처리장';
  loadingPlant = false;
  rightButton.disabled = false;

  setEditModeButtons();

  errorEl.style.display = 'none';
  noticeEl.style.display = 'none';
  editorEl.value = draft.draftText;
  editorEl.style.display = 'block';

  statusEl.textContent = '작성 중이던 내용을 복원했습니다.';\n  headerSavedTime.textContent = '임시 저장 내용 복원';

  setTimeout(() => {
    editorEl.focus();
    const end = editorEl.value.length;
    editorEl.setSelectionRange(end, end);
    editorEl.scrollTop = editorEl.scrollHeight;
  }, 80);

  return true;
}



function updateAppViewportHeight() {
  // Android Chrome은 키보드 입력 중 커서를 보이게 하려고
  // visual viewport 자체를 위아래로 이동(offsetTop)시킬 수 있습니다.
  // 높이뿐 아니라 그 이동량까지 상세화면의 top에 그대로 반영하면
  // 파란 상단 영역이 현재 보이는 화면의 맨 위에 계속 고정됩니다.
  const vv = window.visualViewport;

  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;

  if (h && Number.isFinite(h)) {
    document.documentElement.style.setProperty('--app-height', `${Math.round(h)}px`);
  }

  if (Number.isFinite(top)) {
    document.documentElement.style.setProperty('--vv-top', `${Math.round(top)}px`);
  }
}

function formatHeaderSavedTime(value) {
  const s = String(value || '').trim();

  // Apps Script 형식: yyyy-MM-dd HH:mm
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
  if (m) {
    return `${m[1].slice(2)}.${m[2]}.${m[3]} ${m[4]}:${m[5]}`;
  }

  return s;
}

function formatNow(prefix) {
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${prefix}: ${mm}/${dd} ${hh}:${mi}`;
}

function scrollToBottomSoon() {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      noticeEl.scrollTop = noticeEl.scrollHeight;
    });
  });
}

async function openPlant(plant) {
  selectedPlant = plant;
  currentText = '';
  editMode = false;
  loadingPlant = true;

  // 처리장 읽기 화면을 브라우저 히스토리 한 단계로 등록합니다.
  // Android 시스템 뒤로가기를 누르면 이 단계가 빠지면서 메인화면으로 돌아갑니다.
  try {
    history.pushState({ processMemoDetail: true, plant }, '', location.href);
  } catch (_) {}

  headerPlantName.textContent = plant + '처리장';
  headerSavedTime.textContent = '';

  homeView.style.display = 'none';
  detailView.classList.add('active');
  document.body.classList.add('detail-open');

  detailTitle.textContent = plant + ' 처리장';
  setReadModeButtons();

  rightIcon.textContent = '';
  rightLabel.textContent = '불러오는중';
  rightButton.disabled = true;

  errorEl.style.display = 'none';
  noticeEl.style.display = 'none';
  editorEl.style.display = 'none';

  // 메모가 길거나 통신이 느려도 멈춘 것처럼 보이지 않도록
  // 파란 헤더의 처리장명 바로 아래에서 진행 상태를 계속 보여줍니다.
  startLoading('불러오는 중');

  try {
    const payload = await jsonp({ action:'read', plant });
    if (!payload.ok) throw new Error(payload.error || '내용을 불러오지 못했습니다.');

    stopLoading();
    currentText = payload.text || '';
    statusEl.textContent = payload.updated ? '최종 저장: ' + payload.updated : formatNow('최종 확인');
    headerSavedTime.textContent = payload.updated ? formatHeaderSavedTime(payload.updated) : '';

    loadingPlant = false;
    rightIcon.textContent = '✎';
    rightLabel.textContent = '수정';
    rightButton.disabled = false;

    noticeEl.textContent = currentText.trim() ? currentText : '메모가 비어 있습니다.';
    noticeEl.style.display = 'block';
    editorEl.style.display = 'none';
    errorEl.style.display = 'none';

    scrollToBottomSoon();
  } catch (err) {
    stopLoading();
    loadingPlant = false;
    rightIcon.textContent = '';
    rightLabel.textContent = '다시열기';
    rightButton.disabled = true;
    headerSavedTime.textContent = '불러오기 실패';

    showError(err && err.message ? err.message : '내용을 불러오지 못했습니다.');
  }
}

function showHomeView() {
  selectedPlant = '';
  currentText = '';
  loadingPlant = false;
  headerPlantName.textContent = '처리장';
  headerSavedTime.textContent = '';
  rightButton.disabled = false;
  detailView.classList.remove('active');
  document.body.classList.remove('detail-open');
  homeView.style.display = 'block';
}

function backHome() {
  if (editMode) return;

  // 상세 읽기 화면이 히스토리에 등록되어 있으면 실제 뒤로가기를 사용합니다.
  // 그러면 상세 → 메인 → 앱 종료 순서가 Android 시스템 뒤로가기와 동일해집니다.
  if (history.state && history.state.processMemoDetail) {
    history.back();
    return;
  }

  // 예외적으로 히스토리 상태가 없는 경우에도 화면 자체는 메인으로 복귀시킵니다.
  showHomeView();
}

function setReadModeButtons() {
  leftIcon.textContent = '←';
  leftLabel.textContent = '이전화면';
  rightIcon.textContent = '✎';
  rightLabel.textContent = '수정';
  leftButton.disabled = false;
  rightButton.disabled = false;
}

function setEditModeButtons() {
  leftIcon.textContent = '←';
  leftLabel.textContent = '되돌리기';
  rightIcon.textContent = '✎';
  rightLabel.textContent = '저장';
}

function makeEditTimestamp() {
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `[${yyyy}.${mm}.${dd} ${hh}:${mi}]`;
}

function getLastEditTimestamp(text) {
  const matches = String(text || '').match(/\[\d{4}\.\d{2}\.\d{2}\s+\d{2}:\d{2}\]/g);
  return matches && matches.length ? matches[matches.length - 1] : '';
}

function enterEditMode() {
  if (!selectedPlant || editMode) return;

  editMode = true;

  // Android 뒤로가기 버튼을 눌렀을 때 수정 화면을 벗어나지 않도록
  // 현재 수정 상태를 히스토리에 한 단계 추가합니다.
  try {
    history.pushState({ processMemoEdit: true }, '', location.href);
  } catch (_) {}

  setEditModeButtons();
  noticeEl.style.display = 'none';
  errorEl.style.display = 'none';

  // 기존 메모 원문은 그대로 유지하면서 맨 아래에 날짜/시간을 붙입니다.
  // 단, 방금 저장한 뒤 같은 '분' 안에 다시 수정으로 들어온 경우에는
  // 동일한 [년.월.일 시:분] 타임스탬프를 한 번 더 만들지 않습니다.
  const timestamp = makeEditTimestamp();
  const original = currentText || '';
  const lastTimestamp = getLastEditTimestamp(original);

  if (lastTimestamp === timestamp) {
    editorEl.value = original;
  } else if (!original) {
    editorEl.value = timestamp + '\n';
  } else if (original.endsWith('\n\n')) {
    editorEl.value = original + timestamp + '\n';
  } else if (original.endsWith('\n')) {
    editorEl.value = original + '\n' + timestamp + '\n';
  } else {
    editorEl.value = original + '\n\n' + timestamp + '\n';
  }

  editorEl.style.display = 'block';
  saveDraftLocally();

  statusEl.textContent = '수정 중';
  setTimeout(() => {
    editorEl.focus();
    const end = editorEl.value.length;
    editorEl.setSelectionRange(end, end);
    editorEl.scrollTop = editorEl.scrollHeight;
  }, 50);
}


function releaseEditHistoryGuard() {
  // pushState로 추가한 수정 보호 히스토리 1단계를 정상 종료 시 정리합니다.
  // 이 history.back()은 사용자가 누른 뒤로가기가 아니므로 상세→메인 이동은 막습니다.
  try {
    if (history.state && history.state.processMemoEdit) {
      suppressNextDetailPop = true;
      history.back();
    }
  } catch (_) {
    suppressNextDetailPop = false;
  }
}

function askConfirm(title, message, action) {
  modalTitle.textContent = title;
  modalMessage.textContent = message;
  confirmAction = action;
  confirmModal.classList.add('show');
}

function closeConfirm() {
  confirmModal.classList.remove('show');
  confirmAction = null;
}

function askUndo() {
  if (!editMode) return;

  askConfirm(
    '원래 내용으로 되돌리시겠습니까?',
    '수정한 내용이 취소됩니다.\n원래 저장된 내용으로 되돌립니다.',
    'undo'
  );
}

function doUndo() {
  editorEl.value = currentText;

  // 사용자가 명시적으로 되돌리기를 선택한 경우,
  // 강제종료/새로고침 복원용 임시 수정본도 함께 폐기합니다.
  clearLocalDraft();

  editMode = false;
  releaseEditHistoryGuard();
  setReadModeButtons();

  editorEl.style.display = 'none';
  noticeEl.textContent = currentText.trim() ? currentText : '메모가 비어 있습니다.';
  noticeEl.style.display = 'block';

  statusEl.textContent = formatNow('수정 취소');
  scrollToBottomSoon();
}

function askSave() {
  if (!editMode) return;

  askConfirm(
    '정말 저장하시겠습니까?',
    '수정한 내용을 Google Drive에 저장합니다.',
    'save'
  );
}

async function savePlant() {
  if (!editMode || !selectedPlant) return;

  const text = editorEl.value;
  leftButton.disabled = true;
  rightButton.disabled = true;
  rightLabel.textContent = '저장중';

  // 저장 중에도 처리장명 아래에 점이 움직이는 진행 표시를 보여줍니다.
  startLoading('저장 중');

  // 기존 원문이 그대로 앞부분에 남아 있으면 사용자가 과거 기록을 수정하지 않고
  // 맨 아래에 새 내용만 추가한 경우입니다. 이때는 추가된 부분만 서버로 보냅니다.
  // 과거 내용을 한 글자라도 수정했다면 자동으로 전체 저장 방식으로 전환됩니다.
  const appendOnly = text.startsWith(currentText);
  const sendText = appendOnly ? text.slice(currentText.length) : text;

  const token = Date.now().toString(36) + Math.random().toString(36).slice(2,10);
  const CHUNK_SIZE = 600; // JSONP/URL 길이 안전성을 위해 기존의 보수적인 크기 유지
  const chunks = [];

  for (let i=0; i<sendText.length; i+=CHUNK_SIZE) {
    chunks.push(sendText.slice(i, i+CHUNK_SIZE));
  }
  if (!chunks.length) chunks.push('');

  try {
    let p;

    // 대부분의 일상 메모는 600자 이하이므로 요청 1번으로 바로 추가 저장합니다.
    if (appendOnly && sendText.length <= CHUNK_SIZE) {
      p = await jsonp({
        action:'appendQuick',
        plant:selectedPlant,
        data:sendText
      }, 45000);
      if (!p.ok) throw new Error(p.error || '저장하지 못했습니다.');
    } else {
      const startAction = appendOnly ? 'appendStart' : 'saveStart';
      const chunkAction = appendOnly ? 'appendChunk' : 'saveChunk';
      const finishAction = appendOnly ? 'appendFinish' : 'saveFinish';

      p = await jsonp({ action:startAction, plant:selectedPlant, token });
      if (!p.ok) throw new Error(p.error || '저장을 시작하지 못했습니다.');

      for (let i=0; i<chunks.length; i++) {
        p = await jsonp({
          action:chunkAction,
          plant:selectedPlant,
          token,
          index:String(i),
          data:chunks[i]
        });
        if (!p.ok) throw new Error(p.error || '저장 중 오류가 발생했습니다.');
      }

      p = await jsonp({
        action:finishAction,
        plant:selectedPlant,
        token,
        count:String(chunks.length)
      }, 45000);

      if (!p.ok) throw new Error(p.error || '저장하지 못했습니다.');
    }

    // 서버가 반환한 실제 최종 텍스트를 우선 사용합니다.
    // 동시에 다른 사용자가 내용을 추가한 경우에도 화면과 서버 내용을 맞출 수 있습니다.
    currentText = typeof p.text === 'string' ? p.text : text;
    editMode = false;
    clearLocalDraft();
    releaseEditHistoryGuard();
    setReadModeButtons();

    editorEl.style.display = 'none';
    noticeEl.textContent = currentText.trim() ? currentText : '메모가 비어 있습니다.';
    noticeEl.style.display = 'block';

    stopLoading();
    statusEl.textContent = p.updated ? '저장 완료: ' + p.updated : formatNow('저장 완료');
    headerSavedTime.textContent = p.updated ? formatHeaderSavedTime(p.updated) : '저장 완료';
    scrollToBottomSoon();

  } catch (err) {
    stopLoading();
    statusEl.textContent = '저장 실패';
    headerSavedTime.textContent = '저장 실패';
    alert('저장하지 못했습니다.\n' + (err && err.message ? err.message : '잠시 후 다시 시도해주세요.'));
    setEditModeButtons();
  } finally {
    leftButton.disabled = false;
    rightButton.disabled = false;
  }
}


// -------------------------------------------------
// Chrome 기본 선택/검색 메뉴 억제
// 편집 중인 textarea는 복사/붙여넣기 등을 위해 예외 처리합니다.
// -------------------------------------------------
function isMemoEditorTarget(target) {
  return target === editorEl;
}

document.addEventListener('contextmenu', (e) => {
  if (!isMemoEditorTarget(e.target)) {
    e.preventDefault();
  }
}, true);

document.addEventListener('selectstart', (e) => {
  if (!isMemoEditorTarget(e.target)) {
    e.preventDefault();
  }
}, true);

document.addEventListener('dragstart', (e) => {
  if (!isMemoEditorTarget(e.target)) {
    e.preventDefault();
  }
}, true);

document.querySelectorAll('.plant-btn').forEach(btn => {
  btn.addEventListener('click', () => openPlant(btn.dataset.plant));
});

editorEl.addEventListener('input', () => {
  saveDraftLocally();

  // 새 줄이 늘어날 때 textarea 내부에서만 스크롤되어
  // 현재 입력 위치가 키보드 바로 위에 보이도록 합니다.
  requestAnimationFrame(() => {
    const end = editorEl.value.length;
    if (editorEl.selectionStart === end && editorEl.selectionEnd === end) {
      editorEl.scrollTop = editorEl.scrollHeight;
    }
  });
});

editorEl.addEventListener('focus', () => {
  updateAppViewportHeight();

  // 키보드가 완전히 올라온 뒤 한 번 더 보정
  setTimeout(() => {
    updateAppViewportHeight();
    editorEl.scrollTop = editorEl.scrollHeight;
  }, 250);
});

document.addEventListener('selectionchange', () => {
  if (!editMode || document.activeElement !== editorEl) return;
  updateAppViewportHeight();
});

leftButton.addEventListener('click', () => {
  if (editMode) askUndo();
  else backHome();
});

rightButton.addEventListener('click', () => {
  if (loadingPlant || rightButton.disabled) return;
  if (editMode) askSave();
  else enterEditMode();
});

modalNo.addEventListener('click', closeConfirm);
modalYes.addEventListener('click', () => {
  const action = confirmAction;
  closeConfirm();

  if (action === 'undo') doUndo();
  if (action === 'save') savePlant();
});

confirmModal.addEventListener('click', e => {
  if (e.target === confirmModal) closeConfirm();
});

// Android 시스템 뒤로가기 버튼 처리.
// 1) 수정 중: 화면을 벗어나지 않고 작성 내용을 임시저장한 뒤 수정 화면 유지
// 2) 읽기 화면: 메인화면으로 복귀
// 3) 메인화면: 더 이상 가로채지 않아 다음 뒤로가기에서 앱/웹앱이 종료되도록 둠
window.addEventListener('popstate', () => {
  if (editMode) {
    saveDraftLocally();

    // 다시 보호 상태를 넣어 뒤로가기로 수정 화면을 벗어나지 않게 합니다.
    try {
      history.pushState({ processMemoEdit: true, plant: selectedPlant }, '', location.href);
    } catch (_) {}

    statusEl.textContent = '작성 중인 내용이 보호되고 있습니다.';
    setTimeout(() => {
      statusEl.textContent = '수정 중';
    }, 1200);
    return;
  }

  // 저장/되돌리기 완료 시 수정 보호용 히스토리를 내부적으로 한 단계 제거합니다.
  // 그때 발생한 popstate는 상세 읽기 화면을 그대로 유지해야 합니다.
  if (suppressNextDetailPop) {
    suppressNextDetailPop = false;
    return;
  }

  // 사용자가 상세 읽기 화면에서 Android 시스템 뒤로가기를 누른 경우.
  if (detailView.classList.contains('active')) {
    showHomeView();
  }
});

// 홈 버튼, 최근 앱, 화면 꺼짐 등으로 앱이 백그라운드로 갈 때
// 작성 중인 내용을 한 번 더 저장합니다.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && editMode) {
    saveDraftLocally();
  }
});

// 모바일 브라우저가 페이지를 메모리에서 내리기 직전에도 추가 저장
window.addEventListener('pagehide', () => {
  if (editMode) saveDraftLocally();
});

// 모바일 키보드가 열리거나 화면 높이가 변할 때도
// 편집창의 현재 입력 위치가 보이도록 맨 아래 위치를 유지합니다.
updateAppViewportHeight();

window.addEventListener('resize', updateAppViewportHeight);
window.addEventListener('orientationchange', () => {
  setTimeout(updateAppViewportHeight, 100);
});

if (window.visualViewport) {
  const keepEditorCaretVisible = () => {
    updateAppViewportHeight();

    if (!editMode) return;

    requestAnimationFrame(() => {
      const end = editorEl.value.length;

      // 입력 커서가 맨 끝에 있을 때는 textarea 자체만 아래로 이동
      if (editorEl.selectionStart === end && editorEl.selectionEnd === end) {
        editorEl.scrollTop = editorEl.scrollHeight;
      }
    });
  };

  window.visualViewport.addEventListener('resize', keepEditorCaretVisible);
  window.visualViewport.addEventListener('scroll', keepEditorCaretVisible);
}

// Android Chrome / 설치형 웹앱에서 화면 최상단을 아래로 당겨
// 브라우저 새로고침이 발생하는 것을 추가로 방지합니다.
let touchStartY = 0;

document.addEventListener('touchstart', e => {
  if (!e.touches || !e.touches.length) return;
  touchStartY = e.touches[0].clientY;
}, { passive:true });

document.addEventListener('touchmove', e => {
  if (!e.touches || !e.touches.length) return;

  const currentY = e.touches[0].clientY;
  const pullingDown = currentY > touchStartY;

  // 메모/편집 박스 내부 스크롤은 허용합니다.
  // 페이지 바깥쪽에서 아래로 당기는 동작만 차단해 Chrome 새로고침을 방지합니다.
  const insideScrollableMemo = noticeEl.contains(e.target) || editorEl === e.target;
  if (pullingDown && window.scrollY <= 0 && !insideScrollableMemo) {
    e.preventDefault();
  }
}, { passive:false });

window.addEventListener('beforeunload', () => {
  if (editMode) saveDraftLocally();
});

// 현재 최초 화면을 메인 상태로 표시합니다.
// 상세 화면에서 뒤로가면 이 상태로 돌아오고, 메인에서 한 번 더 뒤로가면
// 브라우저/PWA의 기본 동작에 따라 앱을 빠져나가게 됩니다.
try {
  history.replaceState({ processMemoHome: true }, '', location.href);
} catch (_) {}

// 비정상 종료/새로고침 전에 작성하던 메모가 있으면 자동 복원
restoreLocalDraft();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=8', { updateViaCache: 'none' }).catch(() => {});
  });
}
</script>
